<!doctype html>
<html lang="ko">
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <meta name='description' content='유형별 팝업 단독 보기' />
    <meta name='theme-color' content='#123e49' />
    <title>속초 DT | 스타일 수정 — 실측 - 표층</title>    
    <script type="module" crossorigin src="../assets/modulepreload-polyfill-P2Xu9kJm.js"></script>
    <script type="module" crossorigin src="../assets/map-toolbar-CYX6lTuw.js"></script>
    <script type="module" crossorigin src="../assets/marine-BmRvwfSZ.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/map-toolbar-Cm06Wtwl.css">
  </head>
  <body>
    <div
      class="marine-stage marine-stage--standalone"
      data-screen="style-surface"
      data-root=".."
      data-modal-initial="true"
      data-camera-initial="false"
      data-target-initial="false"
      data-cluster-initial="false"
      data-playing-initial="false"
    >
      <a class="standalone-back" href="../list.html">← 페이지 목록</a
      ><button
        class="marine-button standalone-reopen"
        type="button"
        data-style-open="surface"
      >
        스타일 수정 열기</button
      > <div class='style-backdrop' data-style-backdrop hidden>
      <section
        class='style-dialog'
        role='dialog'
        aria-modal='true'
        aria-labelledby='style-dialog-title'
        tabindex='-1'
        data-style-dialog
        data-style-type='surface'
      >
        <header class='style-dialog__header'><div><p>스타일 수정</p><div
              class='style-dialog__heading'
            ><img data-style-dot src='../images/markers/surface-dot.svg' alt='' /><h2
                id='style-dialog-title'
              >실측 - 표층</h2><span>2026-01-10</span><small>2회차</small></div></div><button
            class='square-close'
            type='button'
            data-style-close
            aria-label='스타일 수정 닫기'
          ><img src='../images/icons/modal-close.svg' alt='' /></button></header>
        <form data-style-form novalidate><div class='style-dialog__body'>
            <p class='style-notice' style='--item-color:#569300'><img
                data-style-notice-icon
                src='../images/icons/surface-notice.svg'
                alt=''
              />원본 데이터는 변경되지 않음</p>
            <label class='style-field'>표시 명칭 (별칭)<input
                name='alias'
                type='text'
                value='실측 - 표층'
                maxlength='40'
              /><small>비워두면 원본 명칭 표시</small></label>
            <fieldset class='style-color'><legend>사용자 지정 색상</legend><div
                class='style-color__custom'
              ><input
                  name='color'
                  type='color'
                  value='#299d78'
                  aria-label='사용자 지정 색상 선택'
                /><input
                  name='hex'
                  type='text'
                  value='#1D9E77'
                  aria-label='색상 HEX 코드'
                  pattern='#[0-9a-fA-F]{6}'
                  maxlength='7'
                /></div><div class='style-color__palette'><button
                    type='button'
                    data-color='#299d78'
                    style='background:#299d78'
                    aria-label='#299d78 색상'
                    aria-pressed='true'
                  ><img
                        src='../images/icons/selected-color.svg'
                        alt=''
                      /></button><button
                    type='button'
                    data-color='#3c89d8'
                    style='background:#3c89d8'
                    aria-label='#3c89d8 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#7f77d8'
                    style='background:#7f77d8'
                    aria-label='#7f77d8 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#659935'
                    style='background:#659935'
                    aria-label='#659935 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#eda03f'
                    style='background:#eda03f'
                    aria-label='#eda03f 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#de284a'
                    style='background:#de284a'
                    aria-label='#de284a 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#2863e4'
                    style='background:#2863e4'
                    aria-label='#2863e4 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#1e9388'
                    style='background:#1e9388'
                    aria-label='#1e9388 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#d77927'
                    style='background:#d77927'
                    aria-label='#d77927 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#9135e3'
                    style='background:#9135e3'
                    aria-label='#9135e3 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#1b90af'
                    style='background:#1b90af'
                    aria-label='#1b90af 색상'
                    aria-pressed='false'
                  ></button><button
                    type='button'
                    data-color='#475568'
                    style='background:#475568'
                    aria-label='#475568 색상'
                    aria-pressed='false'
                  ></button></div></fieldset>
            <div class='style-symbol'><label class='style-symbol__label' for='symbol-size'>심볼 크기<output
                  data-symbol-output
                >6px</output></label><div class='range-control'><img
                  class='range-control__static'
                  src='../images/controls/settings-slider-fill.svg'
                  alt=''
                /><input
                  id='symbol-size'
                  name='size'
                  type='range'
                  min='2'
                  max='16'
                  value='6'
                  step='2'
                /></div><div class='style-symbol__options'><button
                    type='button'
                    data-symbol-size='2'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-2px.svg' alt='' /><span
                    >2px</span></button><button
                    type='button'
                    data-symbol-size='4'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-4px.svg' alt='' /><span
                    >4px</span></button><button
                    type='button'
                    data-symbol-size='6'
                    aria-pressed='true'
                  ><img src='../images/markers/symbol-6px.svg' alt='' /><span
                    >6px</span></button><button
                    type='button'
                    data-symbol-size='8'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-8px.svg' alt='' /><span
                    >8px</span></button><button
                    type='button'
                    data-symbol-size='10'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-10px.svg' alt='' /><span
                    >10px</span></button><button
                    type='button'
                    data-symbol-size='12'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-12px.svg' alt='' /><span
                    >12px</span></button><button
                    type='button'
                    data-symbol-size='16'
                    aria-pressed='false'
                  ><img src='../images/markers/symbol-16px.svg' alt='' /><span
                    >16px</span></button></div></div>
          </div><footer class='style-dialog__footer'><button
              class='marine-button marine-button--outline'
              type='button'
              data-style-reset
            >기본값 복원</button><button
              class='marine-button'
              type='submit'
            >완료</button></footer></form>
      </section>
    </div>
    </div>
  </body>
</html>
